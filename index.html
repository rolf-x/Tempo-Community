    />
    <!-- Pinned to an exact version with an integrity hash (SRI). To bump: curl the new file, run `openssl dgst -sha384 -binary | openssl base64 -A`. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/inter-ui@4.1.1/inter-variable.css"
      integrity="sha384-sj0i6uufG1G1uPDJt97G0tDnKMWfyxamJycAKts0yUP9qvo6TPgbWW5wBOtIOzX/"
      crossorigin="anonymous"
    />
    <!-- This inline script is allowed by its sha256 in the Content-Security-Policy (vercel.json). Edit it and the hash must change too; `npm test` fails until it does. -->
    <script>
      // Apply the saved theme before the first paint so there is no flash. The store mirrors
      // settings.theme into localStorage ('tempo-theme-v2'; dark is the default); IndexedDB can't be read synchronously.
      ;(function () {
        var t = 'dark'
        try { t = localStorage.getItem('tempo-theme-v2') || 'dark' } catch (e) {}
        try {
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0B0C12' : '#FFFFFF')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
      // Same for the design skin (src/v2/app/design.ts owns the rules; this only avoids a flash of classic):
      // ?design=v2|classic before the hash, or the #/v2 landing, else the saved 'tempo.design'. #/ and #/welcome stay classic.
      ;(function () {
        try {
          var q = new URLSearchParams(location.search).get('design')
          var h = location.hash
          var d = q === 'v2' || q === 'classic' ? q : /^#\/v2(\/|\?|$)/.test(h) ? 'v2' : localStorage.getItem('tempo.design')
          var path = h.replace(/^#\/?/, '').split('?')[0].replace(/\/+$/, '')
          if (d === 'v2' && path !== '' && path !== 'welcome') document.documentElement.classList.add('v2')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- First paint without JavaScript or the app stylesheet; replaced by React. -->
      <style>
        .tempo-boot {
          position: fixed; inset: 0; display: grid; place-items: center;
          background: var(--t-bg, #FFFFFF); color: var(--t-text-muted, #5D606B);
          --boot-mark: #0B0C0F; --boot-ink: #FFFFFF;
        }
        .dark .tempo-boot {
          background: var(--t-bg, #0B0C12); color: var(--t-text-muted, #9A9CA5);
          --boot-mark: #7C7CFF; --boot-ink: #08090B;
        }
        .tempo-boot-content { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .tempo-boot-label { font: 500 14px/20px var(--font-sans, 'InterVariable', 'Inter', system-ui, sans-serif); }
        /* The beat draws, holds and fades in a loop (same as .tempo-mark-loading in src/index.css). */
        .tempo-boot-beat {
          stroke-dasharray: 100 200;
          animation: tempo-boot-beat 2.8s cubic-bezier(0.2, 0, 0, 1) infinite;
        }
        @keyframes tempo-boot-beat {
          0% { stroke-dashoffset: 101; opacity: 1; }
          45% { stroke-dashoffset: 0; opacity: 1; }
          80% { stroke-dashoffset: 0; opacity: 1; }
          100% { stroke-dashoffset: 0; opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
          .tempo-boot-beat { animation: none; stroke-dashoffset: 0; opacity: 1; }
        }
      </style>
      <div class="tempo-boot" role="status" aria-label="Loading Tempo">
        <div class="tempo-boot-content" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect width="24" height="24" rx="7" fill="var(--t-mark, var(--boot-mark))" />
            <path class="tempo-boot-beat" d="M5 12H8.6L10.6 6.4L13.4 17.6L15.3 12H19" pathLength="100" stroke="var(--t-mark-ink, var(--boot-ink))" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="tempo-boot-label">Tempo</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
